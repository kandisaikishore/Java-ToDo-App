name: Java compatibility checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "47 2 * * *"

permissions:
  contents: read

jobs:
  java-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - name: Locate standalone Java sources
        shell: bash
        run: |
          set -euo pipefail
          # Compile only standalone sources; framework-dependent modules use Maven/Gradle.
          find . -type f -name '*.java' \
            -not -path './.git/*' \
            -not -path './build-classes/*' \
            -not -path './api/src/*' \
            -not -path './ui/*' \
            -not -path './src/main/java/*' \
            -not -path './backend/src/*' \
            -not -path './src/main/java/*' > /tmp/java-sources.txt
          test -s /tmp/java-sources.txt
          cat /tmp/java-sources.txt
      - name: Compile standalone Java sources
        run: |
          set -euo pipefail
          mkdir -p build-classes
          javac -encoding UTF-8 -d build-classes @/tmp/java-sources.txt
      - name: Build framework modules when present
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r pom; do
            dir="$(dirname "$pom")"
            echo "Testing Maven module: $dir"
            if [[ -x "$dir/mvnw" ]]; then
              (cd "$dir" && ./mvnw --batch-mode --no-transfer-progress test)
            elif [[ -f mvnw && "$dir" == "." ]]; then
              ./mvnw --batch-mode --no-transfer-progress test
            else
              mvn --batch-mode --no-transfer-progress -f "$pom" test
            fi
            count=$((count + 1))
          done < <(find . -type d \( -name .git -o -name target -o -name node_modules \) -prune -o -type f -name pom.xml -print)
          if [[ "$count" == 0 ]]; then
            echo "No Maven modules detected; standalone compatibility compilation completed."
          fi
