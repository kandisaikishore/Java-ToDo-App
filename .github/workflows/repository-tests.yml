name: Repository Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: repository-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Detect stack and run available checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Java tests
        shell: bash
        run: |
          set -euo pipefail
          # Build each Maven module explicitly. The nested API must not be compiled by raw javac.
          mapfile -t pom_files < <(find . -type d \( -name .git -o -name target -o -name node_modules \) -prune -o -type f -name pom.xml -print)
          if (( ${#pom_files[@]} > 0 )); then
            for pom in "${pom_files[@]}"; do
              echo "Testing Maven module: $pom"
              mvn --batch-mode --no-transfer-progress -f "$pom" test
            done
          elif [[ -x ./gradlew ]]; then
            ./gradlew test
          elif [[ -f build.gradle || -f build.gradle.kts ]]; then
            if command -v gradle >/dev/null 2>&1; then gradle test
            else echo "::error::Gradle project found without wrapper or system Gradle"; exit 1; fi
          elif [[ -f ToDoApp.java ]]; then
            javac -encoding UTF-8 ToDoApp.java
          elif find . -type f -name '*.java' -not -path './.git/*' -not -path './build-classes/*' -not -path './api/src/*' -not -path './ui/*' -print -quit | grep -q .; then
            mapfile -d '' java_sources < <(find . -type f -name '*.java' -not -path './.git/*' -not -path './build-classes/*' -not -path './api/src/*' -not -path './ui/*' -print0)
            mkdir -p build-classes
            javac -encoding UTF-8 -d build-classes "${java_sources[@]}"
            echo "::notice::Standalone Java sources compiled; no Maven/Gradle module detected."
          else
            echo "No Java project detected; skipping Java checks."
          fi

      - name: Run Python tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f requirements.txt ]]; then python -m pip install --upgrade pip && pip install -r requirements.txt; fi
          if [[ -f pyproject.toml || -f setup.py || -f pytest.ini || -d tests ]] || find . -maxdepth 2 -name 'test_*.py' -print -quit | grep -q .; then
            python -m pip install pytest
            if [[ -d tests ]] || find . -maxdepth 2 -name 'test_*.py' -print -quit | grep -q .; then pytest -q; else echo "::notice::Python project detected, but no test files were found."; fi
          else
            echo "No Python test suite detected; skipping pytest."
          fi

      - name: Run Node.js checks
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package.json ]]; then
            if [[ -f package-lock.json ]]; then npm ci; else npm install; fi
            npm test --if-present
            npm run build --if-present
          else
            echo "No root package.json detected; skipping Node.js checks."
          fi
